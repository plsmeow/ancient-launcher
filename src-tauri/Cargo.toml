[package]
name = "ancient-launcher"
version = "1.0.0"
description = "A launcher for the Ancient Minecraft client"
authors = ["plsmeow"]
license = "GPL-3.0"
edition = "2021"
rust-version = "1.79.0"

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

tokio = { version = "1", features = ["full"] }
futures = "0.3"

anyhow = "1.0"
thiserror = "2.0"
backon = { version = "1.3.0", default-features = false, features = ["tokio-sleep"] }

void = "1"
directories = "5.0"
once_cell = "1.16.0"

async_zip = { version = "0.0.11", features = ["full"] }
tokio-tar = "0.3.0"
async-compression = { version= "0.3.15", features = ["gzip"] }
sanitize-filename = "0.6.0"
path-absolutize = "4.0"

os_info = "3"
sysinfo = "0.29"

regex = "1.7.0"
uuid = { version = "1.2", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
md5 = "0.7.0"
sha1 = "0.10"
base16ct = {version = "0.2.0", features = ["alloc"] }

tauri = { version = "^2", features = [] }
tauri-plugin-process = "^2"
tauri-plugin-dialog = "^2"
tauri-plugin-opener = "^2"
tauri-plugin-clipboard-manager = "^2"
tauri-plugin-window-state = "^2"

reqwest = { version = "0.13.1", default-features = false, features = ["http2", "charset", "rustls", "system-proxy", "gzip", "json"] }

azalea-auth = { git = "https://github.com/CCBlueX/azalea.git", branch = "custom_auth", package = "azalea-auth" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
strip = true
lto = false
codegen-units = 16
